<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ARWCode</title>
    <style>
      /* The app window itself never scrolls; only the sidebar may. */
      html, body, #root { height: 100%; margin: 0; overflow: hidden; }
      *, *::before, *::after { box-sizing: border-box; }
      /* Hide the scrollbar inside terminals (wheel-scroll still works). */
      .xterm .xterm-viewport { scrollbar-width: none; }
      .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
